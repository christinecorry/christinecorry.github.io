<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrapbook · Christine Corry</title>
<!-- hidden page: linked only from the ✦ in the root footer; not in sitemap.xml -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/favicon.svg?v=3" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Brygada+1918:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script>(function () { try { var t = sessionStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {} })();</script>
<link rel="stylesheet" href="../styles.css?v=7">
<style>
  :root { --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --card: #1b1c20; } }
  :root[data-theme="dark"] { --card: #1b1c20; }

  .top { text-align: center; }
  .top h1 { margin-top: 48px; }
  .tools { display: flex; justify-content: center; gap: 18px; margin: 4px 0 36px; }
  .tools button {
    font: inherit; font-size: 15px; color: var(--muted);
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  .tools button:hover { color: var(--text); }

  .board { max-width: 1240px; margin: 0 auto; padding: 0 20px; columns: 4 230px; column-gap: 18px; }

  .card {
    break-inside: avoid;
    margin: 0 0 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .card img, .card video { display: block; width: 100%; height: auto; }
  .card.text { padding: 16px 18px; }
  .card h3 { font-style: italic; }
  .card .by { display: block; color: var(--muted); font-size: 15px; }
  .card blockquote { margin: 10px 0 0; font-size: 16px; white-space: pre-line; }
  .card .more { display: inline-block; margin: 8px 0 0; font-size: 15px; }
  .card.pin { border: 0; background: none; }
  .card.pin img { border-radius: 3px; }

  .song { display: block; color: var(--text); position: relative; }
  .song:hover { text-decoration: none; border-color: var(--muted); }
  .listen {
    font: inherit; font-size: 14px; color: var(--accent);
    background: none; border: 0; padding: 0; margin-top: 8px; cursor: pointer;
  }
  .song.playing .listen::after { content: " · playing"; color: var(--muted); }

  .vid { position: relative; cursor: pointer; }
  .vid .snd {
    position: absolute; right: 8px; bottom: 8px; font-size: 12px; padding: 2px 8px;
    border-radius: 10px; background: rgba(0, 0, 0, 0.45); color: #fff; pointer-events: none;
  }

  footer { text-align: center; }
</style>
</head>
<body>
<button id="theme-toggle" type="button" aria-label="Switch between light and dark mode" title="Light / dark">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<div class="wrap top">
  <header><nav><a href="../">Christine Corry</a></nav></header>
  <h1>Scrapbook</h1>
  <div class="tools">
    <button id="shuffle">shuffle</button>
  </div>
</div>

<div class="board" id="board"></div>

<div class="wrap"><footer>&copy; 2026 Christine Corry</footer></div>

<script src="items.js?v=9"></script>
<script>
const board = document.getElementById("board");
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// --- cards ---------------------------------------------------------------
const player = new Audio();
function card(it) {
  let c;
  if (it.kind === "photo" || it.kind === "pin") {
    c = el("figure", "card " + it.kind);
    const img = el("img"); img.src = it.src; img.alt = it.alt || "";
    if (it.w) { img.width = it.w; img.height = it.h; img.loading = "lazy"; }
    c.append(img);
  } else if (it.kind === "video") {
    c = el("figure", "card");
    const w = el("div", "vid"), v = el("video");
    Object.assign(v, { src: it.src, muted: true, loop: !!it.loop, playsInline: true, preload: "metadata" });
    w.append(v, el("span", "snd", "sound off"));
    w.addEventListener("click", () => { v.muted = !v.muted; w.lastChild.textContent = v.muted ? "sound off" : "sound on"; if (v.paused) v.play(); });
    c.append(w);
    seen.observe(v);
  } else if (it.kind === "song") {
    c = el("a", "card text song");
    c.href = it.href; c.target = "_blank"; c.rel = "noopener";
    c.innerHTML = `<h3>${esc(it.title)}</h3><span class="by">${esc(it.by)}</span>`;
    const b = el("button", "listen", "&#9654; listen");
    b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      const on = !c.classList.contains("playing");
      board.querySelectorAll(".song.playing").forEach(s => s.classList.remove("playing"));
      player.pause();
      if (on) { player.src = it.preview; player.volume = 0.6; player.play(); c.classList.add("playing"); }
    });
    c.append(b);
  } else {
    c = el("div", "card text");
    c.innerHTML = `<h3>${esc(it.title)}</h3>` +
      (it.by ? `<span class="by">${esc(it.by)}</span>` : "") +
      (it.quote ? `<blockquote>${esc(it.quote)}</blockquote>` : "") +
      (it.link ? `<a class="more" href="${it.link}" target="_blank" rel="noopener">the whole thing &rsaquo;</a>` : "");
  }
  return c;
}
player.addEventListener("ended", () => board.querySelectorAll(".song.playing").forEach(s => s.classList.remove("playing")));

// videos play (silently) only while on screen
const seen = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause()), { threshold: 0.2 });

board.append(...shuffle(ITEMS.slice()).map(card));
document.getElementById("shuffle").onclick = () => board.append(...shuffle([...board.children]));

document.getElementById("theme-toggle").addEventListener("click", function () {
  var h = document.documentElement;
  var dark = h.dataset.theme ? h.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  h.dataset.theme = dark ? "light" : "dark";
  try { sessionStorage.setItem("theme", h.dataset.theme); } catch (e) {}
});
</script>
</body>
</html>
